    # 14:00 UTC = 21:00 (3 ทุ่ม) เวลาประเทศไทย (GMT+7)
    - cron: '0 14 * * *'
  workflow_dispatch: # ปุ่มกดรันเทสได้ตลอดเวลาจาก GitHub

jobs:
